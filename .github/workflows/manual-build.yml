name: Build LNLogin manually
run-name: Manual LNLogin build (${{ inputs.platform }})

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch, tag, or commit SHA (visible in run metadata)
        required: true
        default: main
        type: string
      platform:
        description: Build one platform per run
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - windows-x64
          - linux-x64
      run_tests:
        description: Run local automation regression unit tests before packaging
        required: true
        default: true
        type: boolean
      bundle_engine:
        description: Optional legacy all-in-one bundle (normally leave disabled)
        required: true
        default: false
        type: boolean
      app_revision:
        description: Positive app build revision (increase for a rebuild of the same app version)
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: manual-lnlogin-build
  cancel-in-progress: false

jobs:
  build:
    # Forks, pull requests, collaborators, and non-main workflow refs get no job.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'nguyenducluongg/lnbrowserbuild' &&
      github.actor == 'nguyenducluongg' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.platform == 'macos-arm64' && 'macos-15' || inputs.platform == 'macos-x64' && 'macos-15-intel' || inputs.platform == 'windows-x64' && 'windows-2022' || 'ubuntu-22.04' }}
    timeout-minutes: 180
    environment: private-source-build
    env:
      CI: "true"
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      LNLOGIN_INTERNAL_MODE: "1"
      LNLOGIN_APP_REVISION: ${{ inputs.app_revision }}
      LNLOGIN_BUNDLE_ENGINE: ${{ inputs.bundle_engine }}
    steps:
      - name: Checkout public build controller only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder
          persist-credentials: false
          show-progress: false

      - name: Set up Node without a dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check controller bootstrap and private-publishing regressions
        run: node --test --test-concurrency=1 builder/ci/private-release.test.mjs builder/ci/run-build.test.mjs builder/ci/bundle-engine.test.mjs builder/ci/package-manager.test.mjs

      - name: Check private destination and scoped token
        id: source_check
        env:
          LNLOGIN_SOURCE_TOKEN: ${{ secrets.LNLOGIN_SOURCE_TOKEN }}
          LNLOGIN_SOURCE_REF: ${{ inputs.source_ref }}
        run: node builder/ci/private-release.mjs check

      - name: Checkout private source without keeping credentials
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: nguyenducluongg/lnlogin
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.LNLOGIN_SOURCE_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Check ready native engine pin before compiling
        if: ${{ inputs.bundle_engine }}
        env:
          LNLOGIN_BUILD_PLATFORM: ${{ inputs.platform }}
        run: node builder/ci/bundle-engine.mjs check

      - name: Install, test and package (detailed output stays private)
        id: compile
        env:
          LNLOGIN_BUILD_PLATFORM: ${{ inputs.platform }}
          LNLOGIN_RUN_TESTS: ${{ inputs.run_tests }}
          NODE_OPTIONS: --max-old-space-size=3072
        run: node builder/ci/run-build.mjs

      - name: Download verified private engine and create all-in-one package
        id: bundle
        if: ${{ inputs.bundle_engine }}
        env:
          LNLOGIN_SOURCE_TOKEN: ${{ secrets.LNLOGIN_SOURCE_TOKEN }}
          LNLOGIN_BUILD_PLATFORM: ${{ inputs.platform }}
          LNLOGIN_SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: node builder/ci/bundle-engine.mjs bundle

      - name: Prepare manager-only installers for update gateway
        id: manager
        if: ${{ !inputs.bundle_engine }}
        env:
          LNLOGIN_BUILD_PLATFORM: ${{ inputs.platform }}
          LNLOGIN_SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: node builder/ci/package-manager.mjs

      - name: Save diagnostics and binaries to the private source repository
        if: ${{ always() && !cancelled() && steps.source_check.outcome == 'success' }}
        env:
          LNLOGIN_SOURCE_TOKEN: ${{ secrets.LNLOGIN_SOURCE_TOKEN }}
          LNLOGIN_BUILD_PLATFORM: ${{ inputs.platform }}
          LNLOGIN_BUILD_OUTCOME: ${{ steps.compile.outcome == 'success' && (steps.bundle.outcome == 'success' || steps.manager.outcome == 'success') && 'success' || 'failure' }}
          LNLOGIN_SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: node builder/ci/private-release.mjs publish
